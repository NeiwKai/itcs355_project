name: Monitor Drift & Send Alerts

on:
  schedule:
    - cron: '1 * * * *'  # Periodic check
  workflow_dispatch:        # Manual check
  workflow_run:
    workflows: ["CD"]      # Runs automatically after your CD workflow completes
    types:
      - completed

jobs:
  check-drift:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Telemetry Drift Metrics & Send Email Alert
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_NAMESPACE: ${{ vars.HF_NAMESPACE || 'NeiwKai' }}
          SMTP_SERVER: "smtp.gmail.com"
          SMTP_PORT: "587"
          ALERT_SENDER_EMAIL: ${{ secrets.ALERT_SENDER_EMAIL }}
          ALERT_SENDER_PASSWORD: ${{ secrets.ALERT_SENDER_PASSWORD }}
          ALERT_RECIPIENT_EMAIL: ${{ secrets.ALERT_RECIPIENT_EMAIL }}
        run: |
          python scripts/check_telemetry_alerts.py
