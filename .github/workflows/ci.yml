name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write 

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan history for credentials
        run: python3 scripts/scan_secrets.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          pip install --upgrade pip
          pip install --require-hashes -r requirements.txt

      - name: Lint
        # ruff is pinned in requirements.txt and installed above. Installing it unpinned
        # here would let a new ruff release fail this build on unchanged code.
        run: ruff check src/ service/ scripts/ tests/

      - name: Portability audit
        run: python scripts/portability_audit.py

      - name: Download dataset
        run: python scripts/get_dataset.py

      - name: Data contract tests
        run: pytest -q tests/test_data.py

      - name: Model behaviour tests
        run: pytest -q tests/test_model_behaviour.py

      - name: Service tests
        run: pytest -q tests/test_service.py

  build:
    # Both, deliberately: nothing gets built or pushed from a commit that leaks a
    # credential, even though CD already gates on the whole workflow being green.
    needs: [test, secrets]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # The integration test below runs get_dataset/train/export on the runner to
      # produce the artefact the serving container is then asked to serve, so this job
      # needs the same interpreter and pins as the test job.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          pip install --upgrade pip
          pip install --require-hashes -r requirements.txt

      - name: Build training image
        run: docker buildx build --platform linux/amd64 -t itcs355-proj:${{ github.sha }} --load .

      - name: Build serving image
        run: docker buildx build --platform linux/amd64 -f service/Dockerfile.serve -t itcs355-proj-serve:${{ github.sha }} --load .

      - name: Integration test
        run: |
          python scripts/get_dataset.py
          python -m src.train --metrics-out reports/metrics.json
          python scripts/export_model.py --out reports/model.joblib
          docker run -d --rm --name svc -p 8080:8080 \
            -v "$PWD/reports:/app/reports:ro" \
            -e MODEL_PATH=/app/reports/model.joblib \
            -e MODEL_VERSION=${{ github.sha }} \
            itcs355-proj-serve:${{ github.sha }}
          for i in $(seq 1 30); do
            curl -sf localhost:8080/ready && break || sleep 2
          done
          curl -sf -X POST localhost:8080/predict \
            -H 'content-type: application/json' \
            -d '{"temp_c":78.4,"vibration_mm_s":3.1,"pressure_kpa":315.2,"hours_since_service":4200,"load_pct":68,"ambient_humidity":55}' \
            | tee /dev/stderr | grep -q probability
          docker stop svc

      # Images are tagged with the commit SHA, never `latest`. A `latest` tag makes it
      # impossible to say which code is serving, which is the question you will be asked
      # during an incident.
